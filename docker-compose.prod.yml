services:
  api:
    image: amirowdenis/solar-future-api:${IMAGE_TAG:-latest}
    container_name: backend
    ports:
      - '4000:4000'
      - '7070:7070'
    environment:
      DATABASE_URL: postgresql://solar:${POSTGRES_PASSWORD}@postgres:5432/solar
      CORS_ORIGINS: ${CORS_ORIGINS}
      API_KEY: ${API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  front:
    image: amirowdenis/solar-future-front:${IMAGE_TAG:-latest}
    container_name: frontend
    ports:
      - '3000:3000'
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: solar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: solar
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solar -d solar"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres_data:
  uploads_data:
