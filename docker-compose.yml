services:  
  api:    
    build: ./backend    
    container_name: backend    
    ports:
      - '4000:4000'
      - '7070:7070'
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/solar
      - CORS_ORIGINS=${CORS_ORIGINS}
      - API_KEY=${API_KEY}
    links:
      - mongodb
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:     
      - ./backend:/app      
      - /app/node_modules
    depends_on:
      - mongodb
  front:    
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: frontend    
    ports:      
      - '3000:3000'
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
  mongodb:
    image:  mongo:4.4.17-focal
    container_name: mongodb
    ports:
      - 27017:27017
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    deploy:
      resources:
        limits:
          memory: 384M
  mongo-express:
    image: mongo-express:0.54.0
    restart: always
    container_name: mongo-express
    # Доступ только с локального хоста (не с интернета)
    ports:
      - "127.0.0.1:8081:8081"
    deploy:
      resources:
        limits:
          memory: 128M
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=password
      - ME_CONFIG_MONGODB_SERVER=mongodb