services:  
  api:    
    build: ./backend    
    container_name: backend    
    ports:      
      - '4000:4000'
    expose:
    - '7070'
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/solar
    links:
      - mongodb
    restart: unless-stopped  
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:     
      - ./backend:/app      
      - /app/node_modules
    depends_on:
      - mongodb
  front:    
    build: ./frontend    
    container_name: frontend    
    ports:      
      - '3000:3000'
    restart: unless-stopped   
    volumes:     
      - ./frontend:/app      
      - /app/node_modules
  mongodb:
    image:  mongo:4.4.17-focal
    container_name: mongodb
    ports:
      - 27017:27017
  mongo-express:
    image: mongo-express:0.54.0
    restart: always
    container_name: mongo-express
    ports:
      - 8081:8081
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=password
      - ME_CONFIG_MONGODB_SERVER=mongodb