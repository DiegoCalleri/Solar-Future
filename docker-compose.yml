name: solar

services:
  api:
    build: ./backend
    container_name: solar-backend
    ports:
      - '4000:4000'
      - '7070:7070'
    environment:
      - DATABASE_URL=postgresql://solar:${POSTGRES_PASSWORD:-solar}@postgres:5432/solar
      - CORS_ORIGINS=${CORS_ORIGINS}
      - API_KEY=${API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run dev

  front:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_EMAIL: ${NEXT_PUBLIC_EMAIL}
    container_name: solar-frontend
    ports:
      - '3000:3000'
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  postgres:
    image: postgres:16-alpine
    container_name: solar-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: solar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-solar}
      POSTGRES_DB: solar
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solar -d solar"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres_data:
  uploads_data:
